name: portfolio
services:
  portfolio:
    image: ghcr.io/ryanonmars/portfolio:${IMAGE_TAG:-v0.2.0}
    init: true
    user: '${PUID:-1000}:${PGID:-1000}'
    environment:
      PUBLIC_ORIGIN:
      LOCAL_ORIGIN:
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-}'
      TRUSTED_HOSTS: '${TRUSTED_HOSTS:-}'
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-3088}:3088'
    volumes:
      - type: bind
        source: ${DATA_PATH:-/mnt/tank/configs/portfolio}
        target: /data
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
