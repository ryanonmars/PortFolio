name: portfolio
services:
  portfolio:
    image: ghcr.io/ryanonmars/portfolio:local
    build: .
    init: true
    user: '${PUID:-1000}:${PGID:-1000}'
    environment:
      PUBLIC_ORIGIN:
      LOCAL_ORIGIN:
      ALLOWED_ORIGINS: '${ALLOWED_ORIGINS:-}'
      TRUSTED_HOSTS: '${TRUSTED_HOSTS:-}'
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${PORT:-3088}:3088'
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
