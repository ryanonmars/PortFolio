name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: docker compose build
      - name: Validate hardened container
        run: |
          sudo install -d -m 700 -o 1000 -g 1000 data
          PORT=3101 docker compose up -d --wait
          docker compose exec -T portfolio node dist/scripts/database.js migrate
          docker compose exec -T portfolio node dist/scripts/database.js backup /data/backups/ci.sqlite
      - name: Stop trial container
        if: always()
        run: docker compose down
