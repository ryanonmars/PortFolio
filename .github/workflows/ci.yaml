name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Test, build and container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@10.28.2
      - run: pnpm install --frozen-lockfile
      - name: Check dependency advisories
        run: pnpm audit --audit-level=moderate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit, API, security and migration tests
        run: pnpm test
      - name: Production backend and frontend build
        run: pnpm build
      - name: Build and verify the independently installable MCP package
        run: |
          pnpm package:mcp
          MCP_VERSION="$(node -p "require('./package.json').version")"
          PORTFOLIO_MCP_ARCHIVE="$PWD/dist/release/portfolio-mcp-v$MCP_VERSION.tar.gz" pnpm test:package:mcp
      - name: Install browser engines and system dependencies
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Desktop and mobile browser tests
        run: pnpm test:e2e
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore
      - name: Build production container
        run: docker compose build
      - name: Validate attachment persistence and complete backup recovery
        env:
          PORTFOLIO_TEST_IMAGE: ghcr.io/ryanonmars/portfolio:local
        run: pnpm exec tsx scripts/test-attachments-container.ts
      - name: Validate browser backup restore and recovery across runtime identities
        env:
          PORTFOLIO_TEST_IMAGE: ghcr.io/ryanonmars/portfolio:local
          PORTFOLIO_TEST_UPGRADE_IMAGE: ghcr.io/ryanonmars/portfolio:v0.4.0
        run: pnpm exec tsx scripts/test-settings-backup-container.ts
      - name: Validate numeric container identities, permissions and upgrades
        run: node scripts/test-container-identity.js ghcr.io/ryanonmars/portfolio:local
